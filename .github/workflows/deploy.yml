name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  web:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Write .env
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_BUILD_ID: ${{ github.sha }}
          VITE_UPDATE_MANIFEST: https://jdial1.github.io/${{ github.event.repository.name }}/version.json
          VITE_APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/Hnefatafl-Viking-Chess.apk
        run: |
          printf '%s\n' \
            "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY" \
            "VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN" \
            "VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID" \
            "VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET" \
            "VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID" \
            "VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID" \
            "VITE_FIREBASE_DATABASE_URL=$VITE_FIREBASE_DATABASE_URL" \
            "VITE_BUILD_ID=$VITE_BUILD_ID" \
            "VITE_UPDATE_MANIFEST=$VITE_UPDATE_MANIFEST" \
            "VITE_APK_URL=$VITE_APK_URL" \
            > .env
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Write version manifest
        run: printf '{"id":"%s"}\n' "$GITHUB_SHA" > dist/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Write .env
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_BUILD_ID: ${{ github.sha }}
          VITE_UPDATE_MANIFEST: https://jdial1.github.io/${{ github.event.repository.name }}/version.json
          VITE_APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/Hnefatafl-Viking-Chess.apk
        run: |
          printf '%s\n' \
            "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY" \
            "VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN" \
            "VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID" \
            "VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET" \
            "VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID" \
            "VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID" \
            "VITE_FIREBASE_DATABASE_URL=$VITE_FIREBASE_DATABASE_URL" \
            "VITE_BUILD_ID=$VITE_BUILD_ID" \
            "VITE_UPDATE_MANIFEST=$VITE_UPDATE_MANIFEST" \
            "VITE_APK_URL=$VITE_APK_URL" \
            > .env
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing GOOGLE_SERVICES_JSON secret"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
      - run: npm ci
      - run: npm run android:sync
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Hnefatafl-Viking-Chess.apk
      - name: Signing fingerprints
        run: keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android
      - uses: actions/upload-artifact@v4
        with:
          name: Hnefatafl-Viking-Chess
          path: Hnefatafl-Viking-Chess.apk
      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Debug APK from ${GITHUB_SHA::7}. Sideload on Android (allow unknown sources). Replaced on every main build."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Hnefatafl-Viking-Chess.apk --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest Hnefatafl-Viking-Chess.apk \
              --title "Latest Android build" \
              --notes "$NOTES" \
              --latest
          fi
